<header><h1>Miao · 一键试弹</h1><a href="https://miao-beat.pages.dev/?instrument=piano&analytics=internal">回原版</a></header>
<p class="hint">按 A，或点下方 A/C4 键。这个测试页先试 C4 一个音。</p>
