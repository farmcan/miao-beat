<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>橘猫 · 吉他动作小样</title>
<style>
:root{color-scheme:light;font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;color:#322c26;background:#f8f4eb}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:28px 36px 40px}header{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.1em}.mark{font-weight:800;font-size:17px;letter-spacing:-.04em}.tag{color:#827367}h1{font-size:clamp(28px,5vw,42px);letter-spacing:-.05em;font-weight:650;margin:28px 0 8px}p{margin:0;color:#8a7969;font-size:14px;line-height:1.7}.stage{position:relative;max-width:500px;margin:0 auto}svg{display:block;width:100%;height:auto;overflow:visible}.shadow{fill:#d7c1a2;opacity:.18}.arm{transform-box:view-box;will-change:transform}.status{min-height:24px;font-size:12px;text-align:center;color:#9b7253}.controls{max-width:640px;margin:16px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{appearance:none;border:1px solid #dfd2bf;background:#fffaf1;color:#4a392b;border-radius:14px;min-height:72px;padding:12px;cursor:pointer;font:inherit;touch-action:none;transition:background .1s,border-color .1s}button strong{font-size:23px;font-weight:650}kbd{font:11px ui-monospace,monospace;color:#a18c77;display:block;margin-top:6px}button.active{background:#f0c49b;border-color:#cf793f}button:focus-visible{outline:2px solid #af622f;outline-offset:4px}.note{max-width:640px;margin:20px auto 0;font-size:12px;display:flex;justify-content:space-between;gap:12px;line-height:1.7;color:#998674}.error{color:#b43422}.hint{font-size:11px;color:#b29c86}#ready{min-height:20px}footer{margin-top:32px;text-align:center;font-size:11px;color:#ad9b88}@media(max-width:600px){main{padding:22px 20px}h1{margin-top:32px}.stage{margin:4px -12px}.controls{gap:7px}button{min-height:68px}.note{display:block}.note span{display:block}.tag{letter-spacing:0;font-size:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<main>
<header><span class="mark">miao / beat</span><span class="tag">橘猫吉他 · 动作小样</span></header>
<h1>它弹，你听。</h1><p>按一下和弦，看看猫怎么扫过琴弦。</p>
<div class="stage"><svg viewBox="0 0 640 550" role="img" aria-label="闭着眼享受音乐的橘猫，抱着木吉他"><defs><clipPath id="bodyClip"><rect x="10" y="15" width="615" height="710"/></clipPath><clipPath id="guitarClip"><rect x="635" y="170" width="630" height="515"/></clipPath><clipPath id="leftClip"><rect x="90" y="780" width="430" height="390"/></clipPath><clipPath id="rightClip"><rect x="730" y="800" width="410" height="380"/></clipPath></defs>
<ellipse class="shadow" cx="320" cy="495" rx="190" ry="12"/>
<g id="ensemble"><g transform="translate(110 20) scale(.65) translate(-10 -15)"><image href="atlas-v1.png" width="1280" height="1280" clip-path="url(#bodyClip)"/></g>
<g transform="translate(190 200) scale(.62) translate(-635 -170)"><image href="atlas-v1.png" width="1280" height="1280" clip-path="url(#guitarClip)"/></g>
<g id="fret" class="arm"><image href="atlas-v1.png" width="1280" height="1280" clip-path="url(#rightClip)"/></g>
<g id="strum" class="arm"><image href="atlas-v1.png" width="1280" height="1280" clip-path="url(#leftClip)"/></g></g>
</svg></div>
<div class="status" id="ready" aria-live="polite">点击和弦准备声音，再按一下开始弹。</div>
<div class="controls" aria-label="吉他和弦"><button data-key="1" aria-label="C和弦，键盘1"><strong>C</strong><kbd>1</kbd></button><button data-key="2" aria-label="Am和弦，键盘2"><strong>Am</strong><kbd>2</kbd></button><button data-key="3" aria-label="F和弦，键盘3"><strong>F</strong><kbd>3</kbd></button><button data-key="4" aria-label="G和弦，键盘4"><strong>G</strong><kbd>4</kbd></button></div>
<div class="note"><span>1—4 弹和弦 · 可连续轻扫</span><span>轻轻扫一下，再听它响。</span></div>
<footer>独立动作小样 · 尚未替换正式版</footer>
</main><script type="module" src="./pilot.js"></script></html>
