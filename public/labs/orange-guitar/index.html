<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>橘猫 · 吉他动作小样</title>
<link rel="stylesheet" href="./style.css">
<main>
<header><span class="mark">miao / beat</span><span class="tag">橘猫吉他 · 动作小样</span></header>
<h1>它弹，你听。</h1><p>按一下和弦，看看猫怎么扫过琴弦。</p>
<div class="stage"><svg viewBox="0 0 640 550" role="img" aria-label="闭着眼享受音乐的橘猫，抱着木吉他"><defs><clipPath id="bodyClip"><rect x="10" y="15" width="615" height="710"/></clipPath><clipPath id="guitarClip"><rect x="635" y="170" width="630" height="515"/></clipPath><clipPath id="leftClip"><rect x="90" y="780" width="430" height="390"/></clipPath><clipPath id="rightClip"><rect x="730" y="800" width="410" height="380"/></clipPath></defs>
<ellipse class="shadow" cx="320" cy="495" rx="190" ry="12"/>
<g id="ensemble"><g transform="translate(110 20) scale(.65) translate(-10 -15)"><image href="atlas-v1.png" width="1280" height="1280" clip-path="url(#bodyClip)"/></g>
<g transform="translate(190 200) scale(.62) translate(-635 -170)"><image href="atlas-v1.png" width="1280" height="1280" clip-path="url(#guitarClip)"/></g>
<g id="fret" class="arm"><image href="atlas-v1.png" width="1280" height="1280" clip-path="url(#rightClip)"/></g>
<g id="strum" class="arm"><image href="atlas-v1.png" width="1280" height="1280" clip-path="url(#leftClip)"/></g></g>
</svg></div>
<div class="status" id="ready" aria-live="polite">点击和弦准备声音，再按一下开始弹。</div>
<div class="controls" aria-label="吉他和弦"><button data-key="1" aria-label="C和弦，键盘1"><strong>C</strong><kbd>1</kbd></button><button data-key="2" aria-label="Am和弦，键盘2"><strong>Am</strong><kbd>2</kbd></button><button data-key="3" aria-label="F和弦，键盘3"><strong>F</strong><kbd>3</kbd></button><button data-key="4" aria-label="G和弦，键盘4"><strong>G</strong><kbd>4</kbd></button></div>
<div class="note"><span>1—4 弹和弦 · 可连续轻扫</span><span>轻轻扫一下，再听它响。</span></div>
<footer>独立动作小样 · 尚未替换正式版</footer>
</main><script type="module" src="./pilot.js"></script></html>
